name: Generate Dynamic Contribution Snake

on:
  schedule:
    # Run automatically every day at midnight (00:00 UTC)
    - cron: "0 0 * * *"
  
  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:
  
  # Run on every push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Deepakkumarkc
          outputs: |
            assets/github_contribution_snake.svg?palette=github-dark
            assets/github_contribution_snake_ocean.svg?color_snake=orange&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353

      - name: Commit & Push Dynamic Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-update dynamic contribution snake animation [skip ci]"
          file_pattern: "assets/*.svg"
